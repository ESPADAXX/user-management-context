name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Acceptance tests (one file per requirement), context server and gate tests
        run: npm test
      - name: Build the web app
        run: npm run build
